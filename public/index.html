<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Jenkins Calculator</title>
  <style>
    body { font-family: sans-serif; max-width: 400px; margin: 60px auto; text-align: center; }
    input { width: 60px; padding: 6px; margin: 4px; }
    button { padding: 6px 12px; margin: 4px; }
    #result { font-size: 1.4em; margin-top: 20px; }
  </style>
</head>
<body>
  <h1>Calculator</h1>
  <input id="a" type="number" value="0">
  <input id="b" type="number" value="0">
  <div>
    <button onclick="calc('add')">+</button>
    <button onclick="calc('subtract')">-</button>
    <button onclick="calc('multiply')">×</button>
    <button onclick="calc('divide')">÷</button>
  </div>
  <div id="result"></div>
  <script src="script.js"></script>
</body>
</html>
